# SPDX-License-Identifier: AGPL-3.0-only
# Phase 1: every call is decided by route-engine. This script only asks,
# applies the answer and reports what happened; it holds no business logic.
# Interface: docs/08-cagri-arayuzu.md (version 1).
#
# This file is a template: names between double underscores are replaced
# from the environment when the container starts (deploy/images/opensips/run.sh).
#   SIP_IP             address to listen on
#   SIP_ADVERTISED_IP  public address, when SIP_IP is a private one (optional)
#   SIP_IP6            IPv6 address to listen on as well (optional; run.sh)
#   ENGINE_URL         route-engine, e.g. http://127.0.0.1:58090
#   ENGINE_TOKEN       the secret route-engine expects from its callers (its
#                      own ENGINE_TOKEN); empty: none is sent
#   MI_SOCKET          management socket the engine ends calls through
#   RTP_CONTROL        rtpengine's control socket, address:port
#   SIP_REALM          digest realm; must equal the API's SIP_REALM
#   TLS_CERT, TLS_KEY  this server's certificate and key; replacing the
#                      files takes effect within a minute, without a restart
#   TLS_CLIENT_CA      file of authorities a caller's certificate may be
#                      signed by; empty: callers are not asked for one
#   SIP_METRICS        address:port Prometheus reads this server's counters on;
#                      the media relay ends dead calls there too (/RPC2)
#   TRACE_TARGET       address:port of our own trace collector, which stores
#                      a copy of every call's signalling for the panel
#   HEP_TARGET         address:port of another HEP collector (Homer) that
#                      gets the same copy; both empty: no tracing
#   TLS_CA_LIST        file of authorities a vendor's certificate may be signed
#                      by; without it, the system's certificate directory
#   REG_TIMER_SEC      how often the registrations with vendors are looked
#                      at (at least 10); each is renewed that long before it
#                      runs out
#   REG_RETRY_SEC      how long a registration that failed waits for its next try

log_level=3
stderror_enabled=yes
syslog_enabled=no

udp_workers=__UDP_WORKERS__
tcp_workers=__TCP_WORKERS__
socket=__SIP_UDP_SOCKET__
socket=__SIP_TLS_SOCKET__
# The same on IPv6 when SIP_IP6 is set (T-28), or nothing; written when the
# container starts (deploy/images/opensips/run.sh).
include_file "/run/opensips/sockets-v6.cfg"
# A branch with this flag is sent only over a connection already open
# (route[take]: a trunk reached through the connection it registered over).
tcp_no_new_conn_bflag=NO_NEW_CONN

mpath="/usr/local/opensips-modules/"

loadmodule "proto_udp.so"
loadmodule "db_text.so"
loadmodule "tls_openssl.so"
loadmodule "tls_mgm.so"
loadmodule "proto_tls.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "mi_fifo.so"
loadmodule "mi_datagram.so"
loadmodule "dialog.so"
loadmodule "topology_hiding.so"
# rr only because uac asks for it; with a dialog the changed number is
# kept there and no Record-Route is ever added.
loadmodule "rr.so"
# Signing in to a vendor that asks for it (401/407): uac_auth() in the
# failure route, with the name and password the engine gave for the route.
loadmodule "uac_auth.so"
loadmodule "uac.so"
# Registering with vendors that take calls only from a registered switch
# (ADR-0035). Which ones, and with what name and password, is the engine's
# word: deploy/images/opensips/registrants.sh writes it to the module's
# table and has it reloaded (reg_reload); the engine reads how each stands
# (reg_list). Nothing in this script takes part.
loadmodule "uac_registrant.so"
loadmodule "rtpengine.so"
loadmodule "json.so"
loadmodule "rest_client.so"
loadmodule "cachedb_local.so"
loadmodule "pike.so"
loadmodule "auth.so"
loadmodule "nathelper.so"
loadmodule "httpd.so"
loadmodule "prometheus.so"
# The media relay's word that a call is dead (no media for RTP_TIMEOUT,
# ADR-0027) arrives over XML-RPC as the management command "teardown"
# (rtpengine module), which ends the dialog: BYE to both sides, and
# local_route tells the engine. Nothing in this script decides it.
loadmodule "mi_xmlrpc_ng.so"
# Counters of this script's own (update_stat), read by Prometheus with the
# rest: refer_refused, the transfers turned away (ADR-0028); media_refused,
# the calls refused because the media relay could not take their offer
# (ADR-0030).
loadmodule "statistics.so"
# Written when the container starts: the tracing modules, or nothing.
include_file "/run/opensips/trace-modules.cfg"

modparam("mi_fifo", "fifo_name", "/run/opensips/opensips_fifo")

# TLS. Two domains: "in" is what callers see when they connect to us, "out"
# is how we connect to vendors, whose certificate must be signed by a
# trusted authority. They are read from a table rather than written here so
# that a renewed certificate can be loaded without a restart (tls_reload);
# deploy/images/opensips/tls-table.sh writes the table and watches the files.
# db_mode 1: read the table's file when it has changed; the default keeps
# the first copy for good and a reload would change nothing.
modparam("db_text", "db_mode", 1)
# The longest value db_text reads from a table, in bytes (T-50). The default
# of 4096 is less than a certificate chain from a public authority (leaf and
# intermediates): such a table could neither be reloaded nor read at start,
# and the SIP core did not start at all. Set by run.sh, which also gives it
# to tls-table.sh so that a file too large is refused with a message before
# the table is written. Taken from the process's own memory only while a
# table is read, then freed.
modparam("db_text", "buffer_size", __DB_TEXT_BUFFER__)
modparam("tls_mgm", "db_url", "text:///run/opensips/tlsdb")
modparam("uac_registrant", "db_url", "text:///run/opensips/regdb")
modparam("uac_registrant", "timer_interval", __REG_TIMER_SEC__)
modparam("uac_registrant", "failure_retry_interval", __REG_RETRY_SEC__)
# Counters for Prometheus, at /metrics. No authentication: private network only.
modparam("httpd", "ip", "__SIP_METRICS_IP__")
modparam("httpd", "port", __SIP_METRICS_PORT__)
modparam("prometheus", "statistics", "core: shmem: tm: dialog: load: sl: refer_refused media_refused")
modparam("statistics", "variable", "refer_refused")
modparam("statistics", "variable", "media_refused")
# The management interface over XML-RPC, at /RPC2 on the same listener, for
# the media relay's "teardown". Every management command can be reached
# there, without authentication, as on the MI socket: private network only.
modparam("mi_xmlrpc_ng", "http_root", "RPC2")

# route-engine ends calls whose funds ran out through this socket
# (dlg_end_dlg). It has no authentication: private network only.
modparam("mi_datagram", "socket_name", "udp:__MI_SOCKET__")
modparam("tm", "fr_timeout", 5)
modparam("tm", "fr_inv_timeout", 30)
modparam("dialog", "default_timeout", 7200)
modparam("rtpengine", "rtpengine_sock", "udp:__RTP_CONTROL__")
# A relay that does not answer (1 s, 5 tries: the module's defaults) is set
# aside, and calls are refused at once while it is (ADR-0030); the module
# asks it again in the background every 10 s, not 60 as by default, so that
# calls come back soon after the relay does.
modparam("rtpengine", "rtpengine_disable_tout", 10)
# An address nobody vouched for may send 30 requests in 2 seconds; past that
# the script bans it for two minutes (see "Strangers" below).
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 30)
modparam("pike", "remove_latency", 120)
# Passwords are checked against the hash the engine hands over; the realm
# must be the one the API binds trunk passwords to (SIP_REALM).
# Callers are challenged with 401 (www_challenge / pv_www_authorize). In this
# build (3.6.10) nothing may change the request before async(); changes are
# made in the resume route (docs/ARCHITECTURE.md, section 4). proxy_challenge
# and fix_nated_contact() are not used; test before bringing them in.
modparam("auth", "calculate_ha1", 0)
modparam("auth", "username_spec", "$avp(auth_user)")
modparam("auth", "password_spec", "$avp(auth_ha1)")
# A changed caller number is put back in the requests of the same call
# without help from the caller: the dialog remembers both forms.
modparam("uac", "restore_mode", "auto")
# What to sign in to a vendor with is kept with the attempt (route[take]);
# the realm is read from the vendor's challenge.
modparam("uac_auth", "auth_username_avp", "$avp(v_user)")
modparam("uac_auth", "auth_password_avp", "$avp(v_pass)")
modparam("uac_auth", "auth_realm_avp", "$avp(v_realm)")
modparam("rest_client", "connection_timeout", 1)
modparam("rest_client", "curl_timeout", 2)

route {
	if (!mf_process_maxfwd_header(10)) {
		send_reply(483, "Too Many Hops");
		exit;
	}

	# Behind address translation (NAT): a request that names a private
	# address for itself (Via, Contact) and came from another one. Its
	# replies go back to the address and port it came from, whatever its
	# Via says. A request with public addresses, or one whose private
	# address is where it really came from, is left alone.
	if (route(natted))
		force_rport();

	if (has_totag()) {
		if (topology_hiding_match()) {
			# A transfer within a call (REFER) is refused, whichever side asks,
			# and the call goes on: a Class 4 switch carries no transfers, and
			# one would be a new call nobody authorised (ADR-0028). A fixed
			# rule, not a decision; it is counted (opensips_refer_refused).
			if (is_method("REFER")) {
				update_stat("refer_refused", 1);
				send_reply(403, "Forbidden");
				exit;
			}
			route(hop);
			if (is_method("BYE")) {
				rtpengine_delete();
				$var(event) = "ended";
				$var(code) = 200;
				route(event);
			} else if (is_method("INVITE")) {
				# A new offer. It goes the way the request goes ("upstream":
				# towards the caller), unless the request carries none: the
				# other side then makes it in its answer, the opposite way
				# (RFC 3261 14.1), and it is handled there
				# (onreply_route[reinvite]); its answer comes in the ACK.
				# Which it is, is kept with the call for the reply: a reply
				# route sees none of the transaction's AVPs (tm's
				# onreply_avp_mode is left at 0). A dialog has one INVITE
				# transaction at a time (RFC 3261 14.1: 491 otherwise).
				$var(up) = 0;
				if ($DLG_dir == "upstream")
					$var(up) = 1;
				if (has_body("application/sdp")) {
					$dlg_val(reoffer) = "request";
					$var(flags) = "replace-origin replace-session-connection";
					route(offer_codecs);
					if (route(natted))
						$var(flags) = $var(flags) + " SIP-source-address";
					rtpengine_offer("$var(flags)");
				} else if ($var(up) == 1) {
					$dlg_val(reoffer) = "down";
				} else {
					$dlg_val(reoffer) = "up";
				}
				t_on_reply("reinvite");
			} else if (is_method("ACK")) {
				route(ack);
			}
			route(relay);
		}
		if (is_method("ACK")) {
			if (t_check_trans())
				t_relay();
			exit;
		}
		send_reply(404, "Not Here");
		exit;
	}

	# Strangers. An address the engine has vouched for (a client's trunk or a
	# vendor's host) is remembered for five minutes and passes freely. Any
	# other address is rate limited, and gets an answer only to a call: its
	# probes with other methods are dropped without a word.
	if (!cache_fetch("local", "known:$si", $var(known))) {
		# pike only holds an address back while it keeps flooding; the ban
		# kept here makes it pay for two minutes.
		if (cache_fetch("local", "ban:$si", $var(banned)))
			exit;
		if (!pike_check_req()) {
			cache_store("local", "ban:$si", "1", 120);
			# The engine keeps the list an operator sees and may lift from.
			$json(b) := "{}";
			$json(b/v) = 1;
			$json(b/src_ip) = $si;
			$json(b/reason) = "flood";
			$json(b/seconds) = 120;
			$var(body) = $json(b);
			$var(rc) = 0;
			route(engine_token);
			rest_post("__ENGINE_URL__/v1/ban", $var(body), "application/json", $var(resp), $var(ct), $var(rc));
			exit;
		}
		# A call or a registration that carries credentials is judged by
		# them, further down.
		if (!is_method("INVITE|REGISTER") || !is_present_hf("Authorization")) {
			$json(q) := "{}";
			$json(q/v) = 1;
			$json(q/src_ip) = $si;
			$var(body) = $json(q);
			$var(rc) = 0;
			route(engine_token);
			rest_post("__ENGINE_URL__/v1/source", $var(body), "application/json", $var(resp), $var(ct), $var(rc));
			if ($var(rc) != 200)
				exit;
			$json(d) := $var(resp);
			# The operator's firewall shuts this address out: nothing is
			# said to it, and the engine is not asked again for a minute.
			$var(blocked) = $json(d/blocked);
			if ($var(blocked) == "true") {
				cache_store("local", "ban:$si", "1", 60);
				exit;
			}
			$var(known) = $json(d/known);
			if ($var(known) != "true") {
				# A stranger's call or registration is asked to sign in: it
				# may come from a trunk recognised by user name rather than
				# by address.
				if (is_method("INVITE|REGISTER"))
					www_challenge("__SIP_REALM__");
				# The address of a registered trunk is no stranger's: its
				# device asking whether the switch is there is answered, or
				# it would take the switch for dead.
				$var(registered) = $json(d/registered);
				if (is_method("OPTIONS") && $var(registered) == "true")
					send_reply(200, "OK");
				exit;
			}
			cache_store("local", "known:$si", "1", 300);
		}
	}

	if (is_method("CANCEL")) {
		if (t_check_trans())
			t_relay();
		exit;
	}

	t_check_trans();

	if (is_method("OPTIONS")) {
		send_reply(200, "OK");
		exit;
	}
	if (is_method("REGISTER")) {
		route(register);
		exit;
	}
	if (!is_method("INVITE")) {
		send_reply(405, "Method Not Allowed");
		exit;
	}

	# A caller that signs in: its password is checked first.
	$var(auth_user) = "";
	if (is_present_hf("Authorization") && !route(signin))
		exit;

	$json(q) := "{}";
	$json(q/v) = 1;
	$json(q/call_id) = $ci;
	$json(q/auth_user) = $var(auth_user);
	$json(q/src_ip) = $si;
	# How the call arrived, and the name in the caller's certificate when it
	# presented one that checked out: a trunk may demand either.
	$json(q/transport) = $socket_in(proto);
	$var(tls_name) = "";
	if ($socket_in(proto) == "tls" && is_peer_verified())
		$var(tls_name) = $tls_peer_subject_cn;
	$json(q/tls_name) = $var(tls_name);
	$json(q/src) = $fU;
	$json(q/dst) = $rU;
	# The number the caller's side asserts and its wish for privacy, as
	# they arrived; what they mean is the engine's business.
	if (is_present_hf("P-Asserted-Identity"))
		$json(q/asserted) = $(ai{uri.user});
	if (is_present_hf("Privacy"))
		$json(q/privacy) = $(hdr(Privacy)[*]);
	$var(body) = $json(q);
	route(engine_token);
	async(rest_post("__ENGINE_URL__/v1/authorize", $var(body), "application/json", $var(resp), $var(ct), $var(rc)), authorized);
}

# Checks the credentials a request carries against the engine's hash of
# the password. True with the user name in $var(auth_user); otherwise the
# request has been answered. A wrong user name is challenged again like a
# wrong password, so the answer does not tell which names exist.
route[signin] {
	$json(c) := "{}";
	$json(c/v) = 1;
	$json(c/username) = $au;
	$var(body) = $json(c);
	$var(rc) = 0;
	route(engine_token);
	rest_post("__ENGINE_URL__/v1/credentials", $var(body), "application/json", $var(resp), $var(ct), $var(rc));
	if ($var(rc) != 200) {
		send_reply(503, "Service Unavailable");
		return(-1);
	}
	$json(d) := $var(resp);
	$var(found) = $json(d/found);
	if ($var(found) != "true") {
		www_challenge("__SIP_REALM__");
		return(-1);
	}
	$avp(auth_user) = $au;
	$avp(auth_ha1) = $json(d/ha1);
	if (!pv_www_authorize("__SIP_REALM__")) {
		www_challenge("__SIP_REALM__");
		return(-1);
	}
	$var(auth_user) = $au;
	return(1);
}

# Registration: a trunk that signs in tells where it is. The password is
# checked here; whether the registration is taken, for how long and what the
# trunk's registrations are is the engine's business. Nothing is kept here.
route[register] {
	if (!is_present_hf("Authorization")) {
		www_challenge("__SIP_REALM__");
		exit;
	}
	if (!route(signin))
		exit;
	$json(q) := "{}";
	$json(q/v) = 1;
	$json(q/auth_user) = $var(auth_user);
	$json(q/src_ip) = $si;
	$json(q/src_port) = $sp;
	$json(q/transport) = $socket_in(proto);
	$var(tls_name) = "";
	if ($socket_in(proto) == "tls" && is_peer_verified())
		$var(tls_name) = $tls_peer_subject_cn;
	$json(q/tls_name) = $var(tls_name);
	if (route(natted))
		$json(q/nat) := "true";
	# Every Contact of the request, as it arrived; the engine reads them.
	if (is_present_hf("Contact"))
		$json(q/contacts) = $(hdr(Contact)[*]);
	if (is_present_hf("Expires"))
		$json(q/expires) = $(hdr(Expires){s.int});
	$json(q/call_id) = $ci;
	$json(q/cseq) = $(cs{s.int});
	if (is_present_hf("User-Agent"))
		$json(q/user_agent) = $ua;
	$var(body) = $json(q);
	$var(rc) = 0;
	route(engine_token);
	rest_post("__ENGINE_URL__/v1/register", $var(body), "application/json", $var(resp), $var(ct), $var(rc));
	if ($var(rc) != 200) {
		send_reply(503, "Service Unavailable");
		exit;
	}
	$json(d) := $var(resp);
	$var(blocked) = $json(d/source_blocked);
	if ($var(blocked) == "true") {
		cache_remove("local", "known:$si");
		cache_store("local", "ban:$si", "1", 60);
	}
	# The answer names every registration of the trunk in force, each with
	# the time it has left; a refusal for asking too short a time, the least
	# that may be asked.
	if ($json(d/contacts) != NULL) {
		$var(contacts) = $json(d/contacts);
		append_to_reply("Contact: $var(contacts)\r\n");
	}
	if ($json(d/min_expires) != NULL) {
		$var(least) = $json(d/min_expires);
		append_to_reply("Min-Expires: $var(least)\r\n");
	}
	$var(code) = $json(d/sip_code);
	$var(reason) = $json(d/reason);
	send_reply($var(code), $var(reason));
	exit;
}

# True for a request that shows signs of address translation: it names a
# private address for itself and that is not where it came from.
route[natted] {
	if (nat_uac_test("private-contact,private-via") && nat_uac_test("diff-ip-src-via,diff-ip-src-contact"))
		return(1);
	return(-1);
}

# A request within a call is sent to the address the side it is for was
# first heard from, when that side is behind address translation or was
# reached at the address of its registration: what it calls itself
# (Contact) is then an address only its own network knows. The addresses
# are kept with the call. "upstream" is towards the caller.
route[hop] {
	if ($DLG_dir == "upstream") {
		if ($dlg_val(caller_hop) != NULL)
			$du = $dlg_val(caller_hop);
	} else if ($dlg_val(callee_hop) != NULL && $dlg_val(callee_hop) != "-") {
		$du = $dlg_val(callee_hop);
	}
}

route[authorized] {
	if ($rc < 0 || $var(rc) != 200) {
		send_reply(503, "Service Unavailable");
		exit;
	}
	$json(d) := $var(resp);
	# An address the operator's firewall shuts out, though it was known a
	# moment ago: it is refused this once and ignored from now on.
	$var(blocked) = $json(d/source_blocked);
	if ($var(blocked) == "true") {
		cache_remove("local", "known:$si");
		cache_store("local", "ban:$si", "1", 60);
		send_reply(403, "Forbidden");
		exit;
	}
	$var(known) = $json(d/source_known);
	if ($var(known) == "true")
		cache_store("local", "known:$si", "1", 300);
	if ($json(d/route/uri) == NULL) {
		route(trace_refused);
		$var(code) = $json(d/sip_code);
		$var(reason) = $json(d/reason);
		send_reply($var(code), $var(reason));
		exit;
	}

	# The caller gave up while the engine was deciding (its CANCEL has been
	# answered). The engine admitted the call and holds it, so it is told
	# that the attempt it handed out ended with 487, which never moves on;
	# the caller gets the 487 and nothing is sent to the vendor.
	if (t_was_cancelled()) {
		route(trace_refused);
		$var(event) = "failed";
		$var(code) = 487;
		route(event);
		t_reply(487, "Request Terminated");
		exit;
	}

	# "B": send BYE to both sides when the allowed duration runs out. The
	# engine usually ends the call first; this timer is the backstop.
	create_dialog("B");
	$DLG_timeout = $json(d/max_duration_sec);
	# Kept for the attempts that follow the first: the longest the call may
	# last, and the caller's number as the rules about callers left it.
	$avp(call_max) = $json(d/max_duration_sec);
	if ($json(d/caller) != NULL)
		$avp(call_caller) = $json(d/caller);
	# Written when the container starts: copies the call's signalling to the
	# trace collector, or nothing.
	include_file "/run/opensips/trace-call.cfg"
	topology_hiding();
	# A caller behind address translation is sent the requests of this call
	# (a BYE from the far side, a new INVITE) where its INVITE came from.
	# Its Contact is not rewritten (ADR-0014); the address is kept with the
	# call and applied in route[hop].
	if (route(natted)) {
		if ($si =~ ":")
			$dlg_val(caller_hop) = "sip:[" + $si + "]:" + $sp + ";transport=" + $socket_in(proto);
		else
			$dlg_val(caller_hop) = "sip:" + $si + ":" + $sp + ";transport=" + $socket_in(proto);
	}

	# An INVITE without an offer (RFC 3261 13.2.1): the far end makes it in
	# its answer, which goes through the media relay towards the caller
	# (onreply_route[media]), and the caller answers in the ACK (route[ack]).
	# The caller is then the side the switch offers to, and is offered
	# encrypted media (SRTP) exactly when its signalling is encrypted (TLS),
	# the rule route[offer] applies to the vendor's side (ADR-0015,
	# ADR-0043). Kept with the call, not the transaction: a reply route
	# sees none of the transaction's AVPs (tm's onreply_avp_mode is left
	# at 0).
	if (!has_body("application/sdp")) {
		$dlg_val(offerless) = "RTP/AVP";
		if ($socket_in(proto) == "tls")
			$dlg_val(offerless) = "RTP/SAVP";
		$dlg_val(offerless_af) = "IP4";
		if ($si =~ ":")
			$dlg_val(offerless_af) = "IP6";
	}

	# The caller's credentials are not for the vendor to see. They are taken
	# out here and not before the question to the engine: in 3.6.10 the
	# request is not changed before async() (docs/ARCHITECTURE.md, section 4).
	remove_hf("Authorization");

	route(take);
	if (route(attempt))
		exit;
	# Nothing was left with the media relay when it could not take the offer.
	if ($var(no_media) != 1)
		rtpengine_delete();
	send_reply(503, "Service Unavailable");
	exit;
}

# A call the engine refused, or that ended before it was sent on, has its
# INVITE and the answer to it traced when the engine says the call is a
# client's (trace, ADR-0046). What the engine did not recognise (strangers,
# addresses the firewall shuts out, a wrong password) is never traced, and
# neither is anything refused here without asking it (floods, bans): a
# source nobody vouched for must not be able to fill the trace store.
route[trace_refused] {
	if ($json(d/trace) == "true") {
		# Written when the container starts: traces this transaction (the
		# INVITE and its replies), or nothing.
		include_file "/run/opensips/trace-refused.cfg"
	}
}

# Takes the route the engine gave ($json(d/route)): where the request is
# addressed (uri), where it is really sent when that is another place
# (next_hop: a trunk reached at the address its registration came from) and
# what media to offer there, when the engine says (media).
route[take] {
	$ru = $json(d/route/uri);
	# A next hop over TLS is a trunk's own connection, the one it registered
	# over: the request goes through it or not at all. A new connection to
	# the address it came from would reach nothing (an address translator's
	# port) or something else; tm fails the attempt at once instead
	# (route[attempt]) and the engine's next route is tried.
	resetbflag("NO_NEW_CONN");
	if ($json(d/route/next_hop) =~ ";transport=tls")
		setbflag("NO_NEW_CONN");
	if ($json(d/route/next_hop) != NULL) {
		$du = $json(d/route/next_hop);
		$dlg_val(callee_hop) = $json(d/route/next_hop);
		$avp(hopped) = 1;
	} else {
		$du = NULL;
		# Only when an earlier attempt of this call left an address behind.
		if ($avp(hopped) != NULL)
			$dlg_val(callee_hop) = "-";
	}
	# What follows is kept with the attempt (AVPs): the far end's answer may
	# be handled by another worker than this one. Only branch_route[out]
	# and failure_route[next] read it, and both see the transaction's AVPs;
	# a reply route sees none (onreply_avp_mode 0), so what one needs is
	# kept in the dialog instead ($dlg_val; T-43, T-46).
	$avp(o_media) = NULL;
	if ($json(d/route/media) != NULL)
		$avp(o_media) = $json(d/route/media);

	# The route's own settings, each only when the engine gave it.
	# How long the far end may ring before the attempt counts as failed.
	if ($json(d/route/ring_timeout_sec) != NULL)
		$T_fr_inv_timeout = $json(d/route/ring_timeout_sec);
	else
		$T_fr_inv_timeout = 30;
	# The longest the call may last: the smaller of the call's and the route's.
	$var(limit) = $avp(call_max);
	if ($json(d/route/max_duration_sec) != NULL && $json(d/route/max_duration_sec) < $var(limit))
		$var(limit) = $json(d/route/max_duration_sec);
	$DLG_timeout = $var(limit);
	# The caller's number on this route: the route's own, else the call's.
	$avp(o_caller) = NULL;
	if ($json(d/route/caller) != NULL)
		$avp(o_caller) = $json(d/route/caller);
	else if ($avp(call_caller) != NULL)
		$avp(o_caller) = $avp(call_caller);
	$avp(o_identity) = NULL;
	if ($json(d/route/identity) != NULL)
		$avp(o_identity) = $json(d/route/identity);
	# What to sign in with if the far end asks.
	$avp(v_user) = NULL;
	$avp(v_pass) = NULL;
	$avp(v_realm) = NULL;
	$avp(v_signed) = NULL;
	if ($json(d/route/auth/username) != NULL) {
		$avp(v_user) = $json(d/route/auth/username);
		$avp(v_pass) = $json(d/route/auth/password);
	}
	# The codecs to offer, in order: the others are taken out of the offer.
	# Signalling of key presses (telephone-event) is no codec and stays.
	# A caller that offers none of them cannot be carried by this route: the
	# attempt fails without being sent (route[attempt]).
	# Unless the engine says the audio is to be translated (transcode: the
	# caller's side and this route share no codec; it lists the caller's
	# codecs). The caller's codecs are then masked: left out of the offer
	# but still taken from the caller, and the route's codecs are added
	# (codec-transcode-…) whatever the caller offers; the media relay
	# translates between the two. An offer the far end makes within the call
	# gets the same done the other way (codecs_back, route).
	$avp(o_codecs) = NULL;
	$avp(o_nocodec) = NULL;
	$var(codecs) = "";
	$var(found) = 0;
	$var(kind) = " codec-offer-";
	if ($json(d/route/transcode[0]) != NULL)
		$var(kind) = " codec-transcode-";
	$var(i) = 0;
	while ($var(i) < 16 && $json(d/route/codecs[$var(i)]) != NULL) {
		$var(name) = $json(d/route/codecs[$var(i)]);
		if (codec_exists($var(name)))
			$var(found) = 1;
		$var(codecs) = $var(codecs) + $var(kind) + $var(name);
		$var(i) = $var(i) + 1;
	}
	$var(back) = "";
	$var(i) = 0;
	while ($var(i) < 16 && $json(d/route/transcode[$var(i)]) != NULL) {
		$var(back) = $var(back) + " codec-transcode-" + $json(d/route/transcode[$var(i)]);
		$var(i) = $var(i) + 1;
	}
	if ($var(codecs) != "" && $var(back) != "") {
		$avp(o_codecs) = " codec-mask-all" + $var(codecs) + " codec-offer-telephone-event";
		$dlg_val(codecs) = $avp(o_codecs);
		$dlg_val(codecs_back) = " codec-mask-all" + $var(back) + " codec-offer-telephone-event";
	} else if ($var(codecs) != "") {
		if ($var(found) == 0 && has_body("application/sdp"))
			$avp(o_nocodec) = 1;
		$avp(o_codecs) = " codec-strip-all" + $var(codecs) + " codec-offer-telephone-event";
		$dlg_val(codecs) = $avp(o_codecs);
	} else if ($dlg_val(codecs) != NULL) {
		# Only when an earlier attempt of this call left a list behind.
		$dlg_val(codecs) = "-";
	}
	# Only an attempt that translates leaves the other way's list.
	if ($var(back) == "" && $dlg_val(codecs_back) != NULL)
		$dlg_val(codecs_back) = "-";
}

# Sends the call to the route in $ru. A vendor that cannot be reached at all
# (connection refused, failed TLS handshake) never answers, so no failure
# route would run for it: it is reported here as a failed attempt and the
# engine's next route is tried on the spot. So is a route whose codecs the
# caller offers none of (488): nothing is sent there. An attempt whose offer
# the media relay could not take is not sent either, and ends the call
# (route[media_refused]): false, with $var(no_media) set.
route[attempt] {
	$var(tries) = 0;
	$var(no_media) = 0;
	while ($var(tries) < 16) {
		$var(code) = 488;
		if ($avp(o_nocodec) == NULL) {
			t_on_reply("media");
			t_on_failure("next");
			t_on_branch("out");
			if (t_relay())
				return(1);
			if ($var(no_media) == 1) {
				route(media_refused);
				return(-1);
			}
			$var(code) = 503;
			# A caller who gave up in between is not a vendor out of reach.
			if (t_was_cancelled())
				$var(code) = 487;
		}
		$var(event) = "failed";
		route(event);
		if ($var(rc) != 200)
			return(-1);
		$json(d) := $var(resp);
		if ($json(d/route/uri) == NULL)
			return(-1);
		route(take);
		$var(tries) = $var(tries) + 1;
	}
	return(-1);
}

# Media towards the vendor or trunk is encrypted (SRTP) exactly when
# signalling to it is (TLS), unless the engine said what to offer; the
# caller's side keeps whatever the caller offered. The media relay
# translates between the two.
# A side behind address translation names an address in its SDP that cannot
# be reached: the relay is told to start with the address the signalling
# came from. Where the media really comes from, port included, the relay
# learns by itself from the packets that arrive.
# False when the relay did not take the offer: it did not answer in time
# or refused it (no ports left, among others).
route[offer] {
	if (!has_body("application/sdp"))
		return(1);
	$var(flags) = "replace-origin replace-session-connection ICE=remove";
	if ($avp(o_codecs) != NULL)
		$var(flags) = $var(flags) + $avp(o_codecs);
	if (route(natted))
		$var(flags) = $var(flags) + " SIP-source-address";
	# The signalling goes where the request is really sent: the next hop
	# when there is one (a trunk reached through the connection it
	# registered over), else the address it is for.
	$var(to) = $ru;
	if ($du != NULL)
		$var(to) = $du;
	$var(profile) = "RTP/AVP";
	if ($var(to) =~ "transport=tls" && $avp(o_media) != "rtp")
		$var(profile) = "RTP/SAVP";
	# The relay's address in the offer is of the family the far side's
	# address is written in (T-28): IPv6 for an address in brackets, IPv4
	# for a dotted one, so that a caller on one family reaches a vendor on
	# the other through the relay. A name is left to the relay, which keeps
	# the caller's family. The caller's side keeps its own (the answer).
	if (route(af_of_to))
		$var(flags) = $var(flags) + " address-family=" + $var(af);
	if (!rtpengine_offer("$var(flags) $var(profile)"))
		return(-1);
	return(1);
}

# The address family of $var(to) (a SIP URI): true with "IP6" or "IP4" in
# $var(af) when its host is an address, false for a name.
route[af_of_to] {
	if ($var(to) =~ "^sips?:([^@]*@)?[[]") {
		$var(af) = "IP6";
		return(1);
	}
	if ($var(to) =~ "^sips?:([^@]*@)?[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+([:;]|$)") {
		$var(af) = "IP4";
		return(1);
	}
	return(-1);
}

# The same for the SDP of an answer.
route[answer] {
	if (!has_body("application/sdp"))
		return;
	# A reply is judged by its Contact alone: its Via is this server's own.
	if (nat_uac_test("private-contact") && nat_uac_test("diff-ip-src-contact"))
		rtpengine_answer("replace-origin replace-session-connection SIP-source-address");
	else
		rtpengine_answer("replace-origin replace-session-connection");
}

# The codecs the call was set up with, for an offer made after the first:
# added to $var(flags). On a translated call an offer going towards the
# caller ($var(up) 1) is given the caller's codecs instead.
route[offer_codecs] {
	if ($var(up) == 1 && $dlg_val(codecs_back) != NULL && $dlg_val(codecs_back) != "-")
		$var(flags) = $var(flags) + $dlg_val(codecs_back);
	else if ($dlg_val(codecs) != NULL && $dlg_val(codecs) != "-")
		$var(flags) = $var(flags) + $dlg_val(codecs);
}

# The offer a reply makes, to an INVITE that carried none ($var(up) 1: it
# goes towards the caller): through the media relay with the call's codecs,
# as an offer within the call is; the profile ($var(profile): RTP/AVP or
# RTP/SAVP; empty within a call, where each side keeps the one it has) and
# ICE=remove only on the first offer of the call. A side behind address
# translation is judged by its Contact, as for an answer. False when the
# relay did not take it. Its answer is awaited in the ACK ($dlg_val(late)).
route[late_offer] {
	$var(flags) = "replace-origin replace-session-connection";
	if ($var(profile) != "")
		$var(flags) = $var(flags) + " ICE=remove " + $var(profile);
	# The first offer goes to the caller, whose address family the relay
	# has not seen yet: it is the one its INVITE came over (T-28).
	if ($var(profile) != "" && $dlg_val(offerless_af) != NULL)
		$var(flags) = $var(flags) + " address-family=" + $dlg_val(offerless_af);
	route(offer_codecs);
	if (nat_uac_test("private-contact") && nat_uac_test("diff-ip-src-contact"))
		$var(flags) = $var(flags) + " SIP-source-address";
	if (!rtpengine_offer("$var(flags)"))
		return(-1);
	if ($rs >= 200)
		$dlg_val(late) = "1";
	return(1);
}

# An ACK within a call. One with SDP is the answer to an offer made in a
# 200 (route[late_offer]) and goes to the media relay; a retransmitted one
# gives it the same answer again, which changes nothing. An ACK without SDP
# where an answer was due breaks the offer and answer (RFC 3261 13.2.1):
# the media relay has an offer only, the media cannot flow, and the caller
# should have ended the call (13.2.2.4). The switch does: the ACK is passed
# on and the dialog's timer is set to a second, so both sides get BYE and
# the engine hears "ended" (local_route), the way ADR-0026 ends a call
# (ADR-0043).
route[ack] {
	if (has_body("application/sdp")) {
		$var(flags) = "replace-origin replace-session-connection";
		if (route(natted))
			$var(flags) = $var(flags) + " SIP-source-address";
		rtpengine_answer("$var(flags)");
		$dlg_val(late) = "0";
	} else if ($dlg_val(late) == "1") {
		$dlg_val(late) = "0";
		$dlg_val(ack_wait) = "0";
		$DLG_timeout = 1;
		return(1);
	}
	if ($dlg_val(ack_wait) == "1") {
		# The caller acknowledged the answer in time: the call gets back
		# what is left of its allowed duration, counted from the answer as
		# the dialog's timer is (onreply_route[media]).
		$dlg_val(ack_wait) = "0";
		$var(left) = $(dlg_val(limit){s.int}) - $DLG_lifetime;
		if ($var(left) < 1)
			$var(left) = 1;
		$DLG_timeout = $var(left);
	}
	return(1);
}

route[relay] {
	if (!t_relay())
		send_reply(500, "Internal Error");
	exit;
}

# Every question to the engine carries the secret it expects. A header added
# here goes out with the next request only, so this runs before each one.
# The line itself is written when the container starts (run.sh), or nothing
# when no token is set; the token is in no other file and in no log.
route[engine_token] {
	include_file "/run/opensips/engine-token.cfg"
	return(1);
}

# The media relay could not take the offer of an attempt (it does not
# answer, or has no ports left): the call is refused with 503 and no other
# route is tried, since the fault is the switch's own, not the vendor's
# (ADR-0030; for an offer that came in a 200, route[late_refused] and
# ADR-0043). A fixed rule, not a decision. The engine is told the call
# ended with 503: an "ended" event never moves on, and the call is recorded
# with that code. Its cause "media" says the attempt was never sent, so the
# engine does not count it against the vendor (ADR-0039; an engine that
# does not know the field ignores it). The body is built here rather than
# in route[event]: a $var outlives the message in this worker, and every
# other event must go without the cause. The caller's 503 is sent by
# whoever called this. Counted (opensips_media_refused).
route[media_refused] {
	update_stat("media_refused", 1);
	$json(ev) := "{}";
	$json(ev/v) = 1;
	$json(ev/call_id) = $ci;
	$json(ev/event) = "ended";
	$json(ev/sip_code) = 503;
	$json(ev/cause) = "media";
	$var(body) = $json(ev);
	$var(resp) = "";
	$var(rc) = 0;
	route(engine_token);
	rest_post("__ENGINE_URL__/v1/events", $var(body), "application/json", $var(resp), $var(ct), $var(rc));
}

# Reports a call event; a "failed" event may be answered with another route.
route[event] {
	$json(ev) := "{}";
	$json(ev/v) = 1;
	$json(ev/call_id) = $ci;
	$json(ev/event) = $var(event);
	$json(ev/sip_code) = $var(code);
	$var(body) = $json(ev);
	$var(resp) = "";
	$var(rc) = 0;
	route(engine_token);
	rest_post("__ENGINE_URL__/v1/events", $var(body), "application/json", $var(resp), $var(ct), $var(rc));
}

onreply_route[media] {
	if ($dlg_val(offerless) == NULL) {
		route(answer);
	} else if ($dlg_val(gone) == "media") {
		# A 200 sent again after the relay refused its offer: it goes on
		# without its SDP, as the first did.
		remove_body_part("application/sdp");
		exit;
	} else if ($rs > 100 && $rs < 300 && has_body("application/sdp")) {
		# The INVITE carried no offer: this reply makes it. A provisional
		# reply may carry it too (early media); the 200 then repeats it.
		# The vendor sends its 200 again until the ACK comes. One that
		# arrives while another worker still waits for the relay over the
		# first (up to 5 s when the relay does not answer) goes on without
		# its SDP: a 200 cannot be held back (drop() does not stop it), and
		# the vendor's own address must not reach the caller. The relay is
		# asked, and the call refused, once. A caller that acknowledges
		# that 200 without an answer has its call ended (route[ack]).
		if ($rs >= 200) {
			if ($dlg_val(late200) == "busy") {
				remove_body_part("application/sdp");
				exit;
			}
			$dlg_val(late200) = "busy";
		}
		$var(up) = 1;
		$var(profile) = $dlg_val(offerless);
		if (!route(late_offer)) {
			# The relay did not take it. A provisional reply is held back
			# (the caller hears nothing of it); a 200 cannot be, and ends
			# the call (route[late_refused]).
			if ($rs < 200)
				drop();
			route(late_refused);
			exit;
		}
		if ($rs >= 200)
			$dlg_val(late200) = "done";
	}
	if ($rs == 200) {
		# An answer the caller never acknowledges must not keep the call up
		# until its allowed duration runs out (ADR-0026). Until the ACK
		# comes, the dialog may last 32 seconds (64 x T1, RFC 3261 13.3.1.4
		# and 17.1.1.2) or its own limit, if shorter; the dialog's "B" flag
		# then sends BYE to both sides (local_route reports "ended"). The
		# ACK puts the rest of the limit back (route, within a call). The
		# dialog is not confirmed yet here: the timeout set is the one its
		# timer starts with. A limit of 32 seconds or less is left alone. A
		# retransmitted 200 finds ack_wait set, or the dialog confirmed and
		# its time left no longer than 32, and changes nothing. The dialog
		# module's own handling of a 200 that races a CANCEL (create_dialog
		# "E") covers only that case.
		if ($dlg_val(ack_wait) == NULL && $DLG_timeout > 32) {
			$dlg_val(limit) = $DLG_timeout;
			$dlg_val(ack_wait) = "1";
			if ($DLG_timeout > 32)
				$DLG_timeout = 32;
		}
		$var(event) = "answered";
		$var(code) = 200;
		route(event);
	} else if ($rs == 180 || $rs == 183) {
		# The first progress report of an attempt: the engine measures
		# post-dial delay from it, and is told of it once per attempt.
		# Which attempt last told it is kept with the call ($dlg_val(rung):
		# a reply route sees none of the transaction's AVPs, tm's
		# onreply_avp_mode is left at 0). Each attempt is a new branch of
		# the transaction, with a higher index ($T_branch_idx): a reply of
		# a later branch reports again, without any reset in the failure
		# route, and a late one of an attempt already given up (a lower
		# index) reports nothing. Two progress reports of one attempt
		# handled by two workers at once may both reach the engine, which
		# keeps the first (it is told every event may come more than once).
		# A branch sent again with credentials (failure_route[next]) is
		# the same attempt with a new index; the engine likewise keeps the
		# first report it had for it. (T-46)
		if ($dlg_val(rung) == NULL || $(dlg_val(rung){s.int}) < $T_branch_idx) {
			$dlg_val(rung) = $T_branch_idx;
			$var(event) = "ringing";
			$var(code) = $rs;
			route(event);
		}
	}
}

onreply_route[reinvite] {
	if ($dlg_val(reoffer) != "up" && $dlg_val(reoffer) != "down") {
		route(answer);
		exit;
	}
	# The new INVITE carried no offer: the reply makes it, the other way
	# ("up": towards the caller). As with an offer that comes in a request,
	# the reply goes on whether the relay took it or not.
	if ($rs > 100 && $rs < 300 && has_body("application/sdp")) {
		$var(up) = 0;
		if ($dlg_val(reoffer) == "up")
			$var(up) = 1;
		$var(profile) = "";
		route(late_offer);
	}
}

# The media relay could not take the offer a vendor made in its 200 to an
# INVITE without one (route[late_offer]). The answer cannot be refused any
# more; as ADR-0030 has it for an offer in the INVITE, the call is refused
# all the same, with no other route tried (ADR-0043): the 200 goes on
# without its SDP (the vendor's address is not shown, the caller has
# nothing to answer), both sides get BYE a second later (the dialog's
# timer, the "B" flag), and the engine is told the call ended with 503 and
# the cause "media" (route[media_refused]) rather than that it was
# answered: the switch's fault is neither charged to the client nor counted
# against the vendor. The BYEs that follow report nothing (local_route).
route[late_refused] {
	route(media_refused);
	remove_body_part("application/sdp");
	$dlg_val(gone) = "media";
	$dlg_val(ack_wait) = "0";
	$DLG_timeout = 1;
}

# What only this attempt's request carries: changes made here are gone with
# the attempt, so the next one starts from the request as it arrived. (The
# offer used to be rewritten before the attempt instead; a second attempt
# then carried the session description twice.) The caller's number as this
# route shows it: From is changed (the dialog puts the caller's own form
# back in what the caller sees), and headers that would carry the old number
# along are rewritten or left out. And what becomes of the caller's asserted
# identity when the route says: taken out, or set to the number shown.
branch_route[out] {
	# Without the relay the attempt is not sent at all (route[attempt]).
	if (!route(offer)) {
		$var(no_media) = 1;
		drop();
	}
	$var(shown) = $fU;
	if ($avp(o_caller) != NULL) {
		$var(shown) = $avp(o_caller);
		$var(from) = "sip:" + $avp(o_caller) + "@" + $fd;
		uac_replace_from(, $var(from));
	}
	if ($avp(o_identity) == "remove" || $avp(o_identity) == "caller") {
		remove_hf("P-Asserted-Identity");
		remove_hf("P-Preferred-Identity");
		remove_hf("Remote-Party-ID");
		# A caller without a number has no identity to assert.
		if ($avp(o_identity) == "caller" && $var(shown) != NULL && $var(shown) != "")
			append_hf("P-Asserted-Identity: <sip:$var(shown)@$fd>\r\n");
	} else if ($avp(o_caller) != NULL) {
		if (is_present_hf("P-Asserted-Identity")) {
			remove_hf("P-Asserted-Identity");
			append_hf("P-Asserted-Identity: <sip:$var(shown)@$fd>\r\n");
		}
		remove_hf("Remote-Party-ID");
	}
}

failure_route[next] {
	$var(no_media) = 0;
	# A vendor that asks who is calling (401/407) is answered once with the
	# name and password the engine gave for this route; the engine is not
	# told, since it is the same attempt. The realm is the challenge's own.
	if ($avp(v_user) != NULL && $avp(v_signed) == NULL && t_check_status("401|407") && !t_was_cancelled()) {
		$avp(v_signed) = 1;
		if ($T_reply_code == 401)
			$var(asked) = $(<reply>hdr(WWW-Authenticate));
		else
			$var(asked) = $(<reply>hdr(Proxy-Authenticate));
		$avp(v_realm) = $(var(asked){re.subst,/^.*realm="([^"]*)".*$/\1/});
		if (uac_auth()) {
			t_on_reply("media");
			t_on_failure("next");
			t_on_branch("out");
			if (t_relay())
				exit;
			if ($var(no_media) == 1) {
				route(media_refused);
				rtpengine_delete();
				t_reply(503, "Service Unavailable");
				exit;
			}
		}
	}
	$var(event) = "failed";
	$var(code) = $T_reply_code;
	if (t_was_cancelled())
		$var(code) = 487;
	route(event);

	if ($var(rc) == 200) {
		$json(d) := $var(resp);
		if ($json(d/route/uri) != NULL) {
			route(take);
			if (route(attempt))
				exit;
			if ($var(no_media) == 1) {
				rtpengine_delete();
				t_reply(503, "Service Unavailable");
				exit;
			}
		}
	}
	rtpengine_delete();
}

# Requests this server generates itself: the BYEs when the engine ends a
# call, the duration limit is reached or the caller never acknowledged the
# answer.
local_route {
	if (is_method("BYE")) {
		# Each BYE goes to one side of the call; the side behind address
		# translation is reached where it was heard from.
		route(hop);
		# The media session goes with the call, once for both BYEs. It used
		# to be left to the relay's own timeout, which now ends calls
		# (ADR-0027): a minute later it would order an ended call ended.
		if ($dlg_val(media_gone) == NULL) {
			$dlg_val(media_gone) = "1";
			rtpengine_delete();
		}
		# A call refused for its offer in the 200 (route[late_refused]) has
		# already been reported ended, with its code.
		if ($dlg_val(gone) != "media") {
			$var(event) = "ended";
			$var(code) = 200;
			route(event);
		}
	}
}
