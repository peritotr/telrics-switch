# What Prometheus collects and where alerts go. The addresses differ between
# the host and the bridge layout and are read from the mounted targets/.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - file_sd_configs:
        - files: [/etc/prometheus/targets/alertmanager.yml]

scrape_configs:
  - job_name: softswitch
    file_sd_configs:
      - files: [/etc/prometheus/targets/services.yml]
