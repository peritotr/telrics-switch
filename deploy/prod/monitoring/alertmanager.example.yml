# Where alerts are sent. install.sh copies this to alertmanager.yml, which is
# yours to edit and is not overwritten by upgrades. As shipped, alerts are
# collected (and visible in Alertmanager) but nobody is told: name a receiver
# below and set it as the route's receiver.
route:
  receiver: nobody
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: nobody

