# SPDX-License-Identifier: AGPL-3.0-only
# Single-server installation. Settings come from .env next to this file
# (written by install.sh); how the call path is attached to the network comes
# from a second file named in COMPOSE_FILE:
#   docker-compose.host.yml    the server's own network (production, Linux)
#   docker-compose.bridge.yml  a private Docker network (smoke test)
# Guide: docs/09-kurulum.md
name: softswitch

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }

x-nofile: &nofile
  ulimits:
    nofile: { soft: 1048576, hard: 1048576 }

x-app-env: &app-env
  DATABASE_URL: postgres://softswitch:${PG_PASSWORD:?}@postgres:5432/softswitch
  REDIS_URL: redis://redis:6379/0
  NATS_URL: nats://nats:4222
  CLICKHOUSE_URL: http://softswitch:${CLICKHOUSE_PASSWORD:?}@clickhouse:8123/softswitch

services:
  # ---- call path: network settings are in the host/bridge file ----------
  opensips:
    <<: [*service, *nofile]
    build: { context: ../.., dockerfile: deploy/images/opensips/Dockerfile }
    volumes:
      - ${CERTS_DIR:-./certs}:/etc/opensips-tls:ro
    environment:
      # The secret the engine expects from its callers: the SIP core and the
      # API send it, the engine checks it. Empty (an installation from before
      # it existed, until upgrade.sh adds one): the engine serves anyone.
      ENGINE_TOKEN: ${ENGINE_TOKEN:-}
      TLS_CA_LIST: ${TLS_CA_LIST:-}
      TLS_CLIENT_CA: ${TLS_CLIENT_CA:-}
      TLS_WATCH_SEC: ${TLS_WATCH_SEC:-30}
      # Registrations with vendors (ADR-0035): how often the engine is asked
      # for the list, how often the registrations are looked at (each is
      # renewed that long before it runs out; at least 10), and how long a
      # failed one waits for its next try.
      REG_SYNC_SEC: ${REG_SYNC_SEC:-10}
      REG_TIMER_SEC: ${REG_TIMER_SEC:-30}
      REG_RETRY_SEC: ${REG_RETRY_SEC:-60}
    # The registrations' table holds vendors' passwords: kept in memory.
    tmpfs: ["/run/opensips:mode=0700"]
    depends_on: [rtpengine, route-engine]

  rtpengine:
    <<: [*service, *nofile]
    build: { context: ../.., dockerfile: deploy/images/rtpengine/Dockerfile }
    environment:
      # Seconds without media before a call is ended on both sides; on hold
      # (one side not meant to send) the second figure applies (ADR-0027).
      RTP_TIMEOUT: ${RTP_TIMEOUT:-60}
      RTP_HOLD_TIMEOUT: ${RTP_HOLD_TIMEOUT:-3600}

  route-engine:
    <<: [*service, *nofile]
    build: { context: ../.., dockerfile: deploy/images/go/Dockerfile, args: { CMD: route-engine, VERSION: "${SOFTSWITCH_VERSION:-dev}" } }
    # The engine checks the names in TLS vendors' certificates against the
    # same authorities the SIP core accepts, so it reads the same files.
    volumes:
      - ${CERTS_DIR:-./certs}:/etc/opensips-tls:ro
      # Call records wait here until NATS has them, through restarts and
      # crashes of the engine (ADR-0029).
      - engine-journal:/var/lib/softswitch/cdr-journal
    environment:
      ENGINE_TOKEN: ${ENGINE_TOKEN:-}
      # The passwords the switch signs in to vendors with are sealed with
      # this key by the API; the engine reads them with the same key.
      SECRET_KEY: ${SECRET_KEY:-}
      CDR_JOURNAL_DIR: /var/lib/softswitch/cdr-journal
      CDR_JOURNAL_MAX_MB: ${CDR_JOURNAL_MAX_MB:-1024}
      # Rates are read again only where they changed; all of them this
      # often, in seconds (T-30, ADR-0048); 0 = on every load.
      RELOAD_FULL_SEC: ${RELOAD_FULL_SEC:-300}
      # The most calls the media relay may translate between codecs at
      # once (T-09); 0 = none.
      TRANSCODE_MAX: ${TRANSCODE_MAX:-200}
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }
      nats: { condition: service_started }

  # ---- services ----------------------------------------------------------
  # Applies the schema on start and serves the panel.
  api:
    <<: *service
    build: { context: ../.., dockerfile: deploy/prod/images/api/Dockerfile, args: { VERSION: "${SOFTSWITCH_VERSION:-dev}" } }
    environment:
      <<: *app-env
      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:?}
      ENGINE_TOKEN: ${ENGINE_TOKEN:-}
      SIP_REALM: ${SIP_REALM:-softswitch}
      CDR_LIST_SOURCE: ${CDR_LIST_SOURCE:-}
      PANEL_URL: ${PANEL_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_URL: ${SMTP_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      TRUST_PROXY: ${TRUST_PROXY:-}
      FX_SOURCE: ${FX_SOURCE:-}
      FX_URL: ${FX_URL:-}
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  # Prices call records from the queue and copies them to ClickHouse.
  rater:
    <<: *service
    build: { context: ../.., dockerfile: deploy/images/go/Dockerfile, args: { CMD: rater, VERSION: "${SOFTSWITCH_VERSION:-dev}" } }
    environment:
      <<: *app-env
      METRICS_LISTEN: 0.0.0.0:58092
      CDR_KEEP_DAYS: ${CDR_KEEP_DAYS:-0}
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }
      nats: { condition: service_started }
      clickhouse: { condition: service_healthy }

  # Stores the signalling the SIP core copies to it (HEP), for the panel's
  # call traces. Not on the call path: calls go on without it.
  trace-collector:
    <<: *service
    build: { context: ../.., dockerfile: deploy/images/go/Dockerfile, args: { CMD: trace-collector, VERSION: "${SOFTSWITCH_VERSION:-dev}" } }
    environment:
      TRACE_KEEP_DAYS: ${TRACE_KEEP_DAYS:-7}
    depends_on:
      clickhouse: { condition: service_healthy }

  # ---- data --------------------------------------------------------------
  postgres:
    <<: *service
    image: postgres:17
    environment:
      POSTGRES_USER: softswitch
      POSTGRES_PASSWORD: ${PG_PASSWORD:?}
      POSTGRES_DB: softswitch
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "softswitch", "-d", "softswitch"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Calls in progress and reserved funds. Written to disk so a restart does
  # not forget the calls that are still up.
  redis:
    <<: *service
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Call events wait here until the rater has stored them.
  nats:
    <<: *service
    image: nats:2.10
    command: ["-js", "-sd", "/data"]
    volumes: ["nats:/data"]

  clickhouse:
    <<: [*service, *nofile]
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: softswitch
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      CLICKHOUSE_DB: softswitch
    volumes: ["clickhouse:/var/lib/clickhouse"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # The panel over HTTPS, with a certificate obtained and renewed
  # automatically. Started only when asked for (COMPOSE_PROFILES=https) and
  # PANEL_DOMAIN points at this server.
  caddy:
    <<: *service
    profiles: [https]
    image: caddy:2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [api]

  # Copies the certificate Caddy keeps renewed for SIP_DOMAIN into certs/,
  # where the SIP core picks it up without a restart.
  sip-cert:
    <<: *service
    profiles: [https]
    image: caddy:2
    entrypoint: ["/bin/sh", "/sip-cert.sh"]
    environment:
      SIP_DOMAIN: ${SIP_DOMAIN:-}
      SIP_CERT_CHECK_SEC: ${SIP_CERT_CHECK_SEC:-300}
    volumes:
      - ./sip-cert.sh:/sip-cert.sh:ro
      - caddy:/data:ro
      - ${CERTS_DIR:-./certs}:/certs
    depends_on: [caddy]

  # ---- monitoring (COMPOSE_PROFILES=monitoring) ---------------------------
  # Collects the services' counters and evaluates monitoring/alerts.yml.
  prometheus:
    <<: *service
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus

  # Tells people about alerts, as monitoring/alertmanager.yml says.
  alertmanager:
    <<: *service
    profiles: [monitoring]
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager:/alertmanager

volumes:
  engine-journal:
  prometheus:
  alertmanager:
  postgres:
  redis:
  nats:
  clickhouse:
  caddy:
