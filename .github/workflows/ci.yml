# SPDX-License-Identifier: AGPL-3.0-only
# Checks every push and pull request without a lab: Go formatting, vet,
# build and unit tests (tests that need PostgreSQL, Redis or ClickHouse skip
# themselves when their TEST_* address is not set), and the panel's type
# check, message catalogues and build. The SIP scenarios (SIPp), the API
# tests against PostgreSQL and the load test need the lab and are run
# before a release, not here. `make ci` runs the same checks locally.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l cmd pkg db)
          if [ -n "$out" ]; then echo "gofmt would change:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...

  panel:
    name: Panel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Message catalogues
        run: npm run check-i18n
      - name: Build
        run: npm run build
