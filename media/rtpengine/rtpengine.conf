# Template: names between double underscores are replaced from the
# environment when the container
# starts (deploy/images/rtpengine/run.sh).
[rtpengine]
# -1 disables kernel forwarding.
table = __RTP_KERNEL_TABLE__
# The address media is sent from; "private!public" behind address translation.
interface = __RTP_INTERFACE__
# Control socket for the SIP core. No authentication: private network only.
listen-ng = __RTP_CONTROL__
# Counters for Prometheus, at /metrics. Private network only.
listen-http = __RTP_METRICS__
port-min = __RTP_PORT_MIN__
port-max = __RTP_PORT_MAX__
num-threads = __RTP_THREADS__
# A deleted call's ports are given back at once. By default the relay keeps
# them for 30 seconds more; at 200 calls a second that alone holds 24,000
# ports, and a call whose offer finds no port is refused (ADR-0030).
delete-delay = 0
# A call whose media has stopped is ended (ADR-0027): after RTP_TIMEOUT
# seconds without a packet from either side, the relay drops the session
# and asks the SIP core to end the call (b2b-url), which sends BYE to both
# sides and tells the engine. A held call (sendonly, recvonly, inactive)
# where one side is not meant to send is given RTP_HOLD_TIMEOUT instead.
timeout = __RTP_TIMEOUT__
silent-timeout = __RTP_HOLD_TIMEOUT__
# Format 1: the method "teardown" with the call's Call-ID, which the SIP
# core's rtpengine module serves over its management interface (XML-RPC).
b2b-url = __RTP_TEARDOWN_URL__
xmlrpc-format = 1
log-level = 5
